# Development docker-compose with hot reloading
services:
  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: dkl-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dklemailservice
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: dkl-redis-dev
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DKL Email Service with hot reloading
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dkl-email-service-dev
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dklemailservice
      DB_SSL_MODE: disable

      # SMTP Configuration (use your actual values)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      # Registration SMTP
      REGISTRATION_SMTP_HOST: ${REGISTRATION_SMTP_HOST}
      REGISTRATION_SMTP_PORT: ${REGISTRATION_SMTP_PORT:-587}
      REGISTRATION_SMTP_USER: ${REGISTRATION_SMTP_USER}
      REGISTRATION_SMTP_PASSWORD: ${REGISTRATION_SMTP_PASSWORD}
      REGISTRATION_SMTP_FROM: ${REGISTRATION_SMTP_FROM}

      # Email addresses
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      REGISTRATION_EMAIL: ${REGISTRATION_EMAIL}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}

      # Redis Configuration
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # Environment
      APP_ENV: development
      LOG_LEVEL: debug

      # Email Fetch Configuration (optional for dev)
      INFO_EMAIL: ${INFO_EMAIL}
      INFO_EMAIL_PASSWORD: ${INFO_EMAIL_PASSWORD}
      INSCHRIJVING_EMAIL: ${INSCHRIJVING_EMAIL}
      INSCHRIJVING_EMAIL_PASSWORD: ${INSCHRIJVING_EMAIL_PASSWORD}
      IMAP_SERVER: ${IMAP_SERVER:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}

      # Disable auto email fetch in development
      DISABLE_AUTO_EMAIL_FETCH: "true"

      # Notifications (optional)
      ENABLE_NOTIFICATIONS: ${ENABLE_NOTIFICATIONS:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      # Newsletter (optional)
      ENABLE_NEWSLETTER: ${ENABLE_NEWSLETTER:-false}
      NEWSLETTER_SOURCES: ${NEWSLETTER_SOURCES}

      # Rate limiting
      EMAIL_RATE_LIMIT: ${EMAIL_RATE_LIMIT:-10}
      CONTACT_RATE_LIMIT: ${CONTACT_RATE_LIMIT:-5}
      REGISTRATION_RATE_LIMIT: ${REGISTRATION_RATE_LIMIT:-3}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-3600}

      # Metrics
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      METRICS_PORT: ${METRICS_PORT:-9090}

      # Admin API Key
      ADMIN_API_KEY: ${ADMIN_API_KEY}

      # Cloudinary (test credentials)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-test_cloud_name}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-test_api_key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-test_api_secret}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-dkl_images}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET}
      CLOUDINARY_SECURE: ${CLOUDINARY_SECURE:-true}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/tmp  # Exclude tmp directory
      - ./templates:/app/templates:ro
    restart: unless-stopped

volumes:
  postgres_dev_data:
    name: dkl_postgres_dev_data